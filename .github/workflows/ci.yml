name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup regression PowerShell
        shell: pwsh
        run: dotnet tool install PowerShell --version 7.6.9 --tool-path "${{ runner.temp }}/harness-pwsh"

      - name: Restore locked packages
        shell: pwsh
        run: dotnet restore Harness.sln --locked-mode

      - name: Run Core regression tests
        shell: pwsh
        run: dotnet test tests\Harness.Core.Tests\Harness.Core.Tests.csproj -c Debug --no-restore

      - name: Build WinUI x64
        shell: pwsh
        run: dotnet build Harness.sln -c Debug -p:Platform=x64 --no-restore

      - name: Verify formatting
        shell: pwsh
        run: |
          $env:Platform = 'x64'
          dotnet format Harness.sln --verify-no-changes --no-restore

      - name: Verify repository guardrails
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-repo-structure.ps1

      - name: Verify embedded bridge scripts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-bridge-scripts.ps1

      - name: Verify OpenClaw page selection
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-openclaw-selection.ps1

      - name: Verify OpenClaw workspace behavior
        shell: pwsh
        run: '& "${{ runner.temp }}/harness-pwsh/pwsh.exe" -NoProfile -File tools/verify-openclaw-workspace.ps1'

      - name: Verify settings reliability
        shell: pwsh
        run: '& "${{ runner.temp }}/harness-pwsh/pwsh.exe" -NoProfile -File tools/verify-settings-reliability.ps1'

      - name: Verify WebView lifecycle
        shell: pwsh
        run: '& "${{ runner.temp }}/harness-pwsh/pwsh.exe" -NoProfile -File tools/verify-webview-lifecycle.ps1'

      - name: Verify tray recovery
        shell: pwsh
        run: '& "${{ runner.temp }}/harness-pwsh/pwsh.exe" -NoProfile -File tools/verify-tray-recovery.ps1'

      - name: Verify whitespace
        shell: pwsh
        run: git diff --check

      - name: Verify portable update and rollback
        shell: pwsh
        run: ./tools/verify-portable-update.ps1
