<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harness</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #fafafa;
            --text: #202020;
            --secondary: #606060;
            --border: #d6d6d6;
            --surface: #ffffff;
            --accent: #176b51;
            --on-accent: #ffffff;
            --error: #b62626;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #202020;
                --text: #f3f3f3;
                --secondary: #c4c4c4;
                --border: #484848;
                --surface: #2b2b2b;
                --accent: #7dd5b3;
                --on-accent: #122820;
                --error: #ff9595;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
            letter-spacing: 0;
        }
        main { width: min(100%, 608px); margin: 0 auto; padding: 32px 24px; }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 18px; font-weight: 600; }
        header img { width: 28px; height: 28px; object-fit: contain; }
        h1 { margin: 0 0 8px; color: var(--error); font-size: 24px; line-height: 1.3; overflow-wrap: anywhere; }
        p { margin: 0; color: var(--secondary); }
        .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 24px 0; }
        button {
            min-height: 40px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            overflow-wrap: anywhere;
        }
        button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        button:hover { filter: brightness(0.94); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .icon { font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; margin-right: 8px; }
        dl { border-top: 1px solid var(--border); padding-top: 18px; margin: 0; }
        dt { color: var(--secondary); margin-top: 12px; font-size: 12px; }
        dt:first-child { margin-top: 0; }
        dd { margin: 4px 0 0; overflow-wrap: anywhere; user-select: text; }
        #error-status { font-family: Consolas, monospace; font-size: 13px; }
        @media (max-height: 480px) {
            main { padding-top: 16px; }
            header { margin-bottom: 16px; }
            .actions { margin: 16px 0; }
        }
    </style>
</head>
<body>
    <main>
        <header><img id="app-icon" alt="" width="28" height="28"><span>Harness</span></header>
        <h1 id="error-title"></h1>
        <p id="error-description"></p>
        <div class="actions">
            <button id="retry" class="primary" type="button"><span class="icon" aria-hidden="true">&#xE72C;</span><span id="retry-label"></span></button>
            <button id="settings" type="button"><span class="icon" aria-hidden="true">&#xE713;</span><span id="settings-label"></span></button>
        </div>
        <dl>
            <dt id="gateway-label"></dt><dd id="gateway-url"></dd>
            <dt id="status-label"></dt><dd id="error-status"></dd>
        </dl>
    </main>
    <script>
        const data = __HARNESS_ERROR_DATA__;
        document.documentElement.lang = data.language;
        document.getElementById('app-icon').src = data.icon;
        for (const [id, value] of Object.entries(data.labels)) {
            document.getElementById(id).textContent = value;
        }
        for (const action of ['retry', 'settings']) {
            document.getElementById(action).addEventListener('click', () => {
                window.chrome.webview.postMessage({ type: 'harness-error-page-action', action, errorPageToken: data.token });
            });
        }
    </script>
</body>
</html>
